<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web File Explorer</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">
</head>
<body>

    <!-- Main Layout -->
    <div class="app-container d-none" id="appContainer">
        <!-- Top Toolbar -->
        <nav class="navbar navbar-expand-lg border-bottom toolbar glass-panel">
            <div class="container-fluid">
                <a class="navbar-brand text-light" href="#">
                    <i class="bi bi-folder2-open text-warning me-2"></i>
                    File Explorer
                </a>
                
                <div class="d-flex align-items-center flex-grow-1 ms-3 breadcrumb-container rounded-pill px-3 py-1 bg-dark-subtle">
                    <button class="btn btn-sm btn-outline-secondary border-0 me-2" id="btnUp" title="Up">
                        <i class="bi bi-arrow-up"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-secondary border-0 me-2" id="btnRefresh" title="Refresh">
                        <i class="bi bi-arrow-clockwise"></i>
                    </button>
                    <div id="breadcrumb" class="d-flex flex-row align-items-center flex-grow-1 overflow-hidden">
                        <!-- Breadcrumbs injected via JS -->
                    </div>
                </div>

                <div class="d-flex ms-auto align-items-center">
                    <button id="btnLogout" class="btn btn-sm btn-outline-danger d-none">Disconnect</button>
                </div>
            </div>
        </nav>

        <div class="d-flex flex-row h-100 overflow-hidden main-content">
            <!-- Sidebar -->
            <div class="sidebar p-2 border-end glass-panel overflow-auto d-none d-md-block" style="min-width: 200px;">
                <h6 class="text-uppercase text-muted fw-bold ps-2 mt-2 mb-3 fs-7">This PC</h6>
                <ul class="nav flex-column tree-view" id="driveList">
                    <!-- Drives injected here -->
                </ul>
            </div>

            <!-- Content Area -->
            <div class="content-area p-0 m-0 bg-darker overflow-auto w-100 flex-grow-1">
                <table class="table table-dark table-hover mb-0 sticky-header">
                    <thead>
                        <tr>
                            <th scope="col" style="width: 40px;"></th>
                            <th scope="col" class="sortable" data-sort="name">Name</th>
                            <th scope="col" class="sortable d-none d-md-table-cell" data-sort="date">Date modified</th>
                            <th scope="col" class="sortable d-none d-md-table-cell" data-sort="type">Type</th>
                            <th scope="col" class="sortable d-none d-md-table-cell" data-sort="size">Size</th>
                        </tr>
                    </thead>
                    <tbody id="fileList">
                        <!-- Files injected here -->
                    </tbody>
                </table>
                
                <!-- Empty State -->
                <div id="emptyState" class="d-none flex-column align-items-center justify-content-center h-100 text-muted">
                    <i class="bi bi-folder2-open display-1 mb-3"></i>
                    <h4>This folder is empty</h4>
                </div>
            </div>
        </div>
    </div>

    <!-- File Preview Modal -->
    <div class="modal fade" id="previewModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-xl modal-dialog-scrollable">
            <div class="modal-content glass-panel h-100">
                <div class="modal-header border-bottom border-secondary">
                    <h5 class="modal-title d-flex align-items-center" id="previewTitle">
                        <i class="bi bi-file-earmark me-2" id="previewIcon"></i>
                        <span id="previewFilename">Filename</span>
                    </h5>
                    <div>
                        <a href="#" id="btnDownload" class="btn btn-primary btn-sm me-2" download>
                            <i class="bi bi-download me-1"></i> Download
                        </a>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                </div>
                <div class="modal-body p-0 d-flex flex-column bg-darker position-relative">
                    <!-- Image Preview -->
                    <div id="imagePreview" class="d-none w-100 h-100 d-flex align-items-center justify-content-center p-3">
                        <img id="imgPreviewTag" src="" class="img-fluid rounded shadow max-h-100" style="object-fit: contain;">
                    </div>
                    
                    <!-- Monaco Editor Container -->
                    <div id="editorContainer" class="d-none w-100 h-100"></div>
                    
                    <!-- Unsupported Preview -->
                    <div id="unsupportedPreview" class="d-none w-100 h-100 d-flex flex-column align-items-center justify-content-center p-5 text-center">
                        <i class="bi bi-file-earmark-binary display-1 text-muted mb-3"></i>
                        <h4 class="text-light">No preview available</h4>
                        <p class="text-muted">This file format cannot be previewed in the browser.</p>
                        <a href="#" id="btnDownloadLarge" class="btn btn-outline-primary mt-3">Download File</a>
                    </div>
                    
                    <!-- Loading Spinner -->
                    <div id="previewLoading" class="position-absolute top-50 start-50 translate-middle d-none">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Monaco Editor loader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
    <!-- App Scripts -->
    <script src="/js/app.js"></script>
</body>
</html>
